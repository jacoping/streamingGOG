<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
  "http://www.w3.org/TR/html4/loose.dtd">
<html lang="it">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project 2 in Eco-Social Design - Summer 2026</title>
  <style type="text/css">
    body, h1, p, ul, li {
      margin: 0;
      padding: 0;
    }

    html, body {
      overflow: hidden;
    }

    body {
      background-color: #1a1a2e;
      color: #e0e0e0;
      font-family: Georgia, "Times New Roman", Times, serif;
      text-align: center;
    }

    #wrapper {
      width: 95%;
      max-width: 1580px;
      margin: 0 auto;
      padding: 0;
    }

    video {
      display: block;
      width: 100%;
      max-width: 1580px;
      max-height: 986px;
      border-radius: 6px;
      background: #000;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    }

    #filetag {
      position: fixed;
      top: 8px;
      right: 10px;
      font-family: "Courier New", Courier, monospace;
      font-size: 10px;
      color: rgba(255,255,255,0.45);
      background: rgba(0,0,0,0.55);
      padding: 2px 6px;
      border-radius: 2px;
      pointer-events: none; /* note: ignored in Safari 5.1 on HTML elements */
      z-index: 999;
    }

  </style>
</head>
<body>
  <div id="wrapper">
    <div id="filetag"></div>
    <video id="player" controls preload="auto" autoplay onended="autoNext()">
      Il tuo browser non supporta il tag video HTML5.
    </video>
  </div>

  <script type="text/javascript" src="settings.js"></script>
  <script type="text/javascript" src="videos/videolist.js"></script>
  <script type="text/javascript">
    var playlist = (function() {
      var i, out = [];
      for (i = 0; i < PLAYLIST.length; i++) {
        out.push('videos/' + PLAYLIST[i]);
      }
      return out;
    }());
    var current = 0;
    var player = document.getElementById('player');

    var checkCount = 0;
    var autoNextBusy = false;

    function autoNext() {
      if (autoNextBusy) { return; }
      autoNextBusy = true;
      var xhr = new XMLHttpRequest();
      var abortTimer = setTimeout(function() {
        xhr.abort();
        autoNextBusy = false;
        setTimeout(autoNext, 60000); // server unreachable - retry in 1 min
      }, 5000);
      xhr.open('GET', 'check?n=' + (++checkCount), true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          clearTimeout(abortTimer);
          autoNextBusy = false;
          if (xhr.status === 200) {
            // server available - proceed normally
            if (Math.random() > REDIRECT_THRESHOLD) {
              window.location.href = 'index.html';
              return;
            }
            var next;
            do {
              next = Math.floor(Math.random() * playlist.length);
            } while (next === current && playlist.length > 1);
            playItem(next);
          } else {
            setTimeout(autoNext, 60000); // server unreachable - retry in 1 min
          }
        }
      };
      try { xhr.send(null); } catch(e) { autoNextBusy = false; setTimeout(autoNext, 60000); }
    }

    function playItem(index) {
      current = index;
      player.src = playlist[current];
      player.load();
      player.play();
      var name = playlist[current].replace('videos/', '').replace(/.*\//, '');
      if (DEBUG) { document.getElementById('filetag').innerHTML = name; }
    }

    // Every TIMEOUT_SECONDS, trigger autoNext (which checks server availability)
    setInterval(autoNext, TIMEOUT_SECONDS * 1000);

    // Carica e avvia un video a caso
    current = Math.floor(Math.random() * playlist.length);
    player.src = playlist[current];
    player.load();
    player.play();
    var initName = playlist[current].replace('videos/', '').replace(/.*\//, '');
    if (DEBUG) { document.getElementById('filetag').innerHTML = initName; }
  </script>
</body>
</html>
