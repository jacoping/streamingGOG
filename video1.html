<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
  "http://www.w3.org/TR/html4/loose.dtd">
<html lang="it">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamingGOG</title>
  <style type="text/css">
    /* Reset base */
    body, h1, h2, p {
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1a2e;
      color: #e0e0e0;
      font-family: Georgia, "Times New Roman", Times, serif;
      text-align: center;
    }

    #wrapper {
      width: 95%;
      max-width: 1580px;
      margin: 0 auto;
      padding: 40px 20px 60px 20px;
    }

    h1 {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 52px;
      font-weight: bold;
      color: #f0c040;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding-bottom: 16px;
    }

    h2 {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px;
      font-weight: normal;
      color: #a0b4cc;
      letter-spacing: 1px;
      padding-top: 8px;
    }

    hr {
      border: 0;
      border-top: 1px solid #3a3a5a;
      width: 60%;
      margin: 40px auto;
    }

    video {
      width: 100%;
      max-width: 1540px;
      border-radius: 6px;
      margin-top: 30px;
      background: #000;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    }

    .video-label {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      color: #5a6a7a;
      margin-top: 10px;
    }

    #btn-fullscreen {
      display: inline-block;
      margin-top: 14px;
      padding: 8px 22px;
      background: #f0c040;
      color: #1a1a2e;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

  </style>
</head>
<body>
  <div id="wrapper">
    <video id="player" controls preload="metadata">
      <source src="test.mp4" type="video/mp4">
      Il tuo browser non supporta il tag video HTML5.
    </video>
    <br>
  </div>
</body>
</html>
