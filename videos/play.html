<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
  "http://www.w3.org/TR/html4/loose.dtd">
<html lang="it">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project 2 in Eco-Social Design - Summer 2026</title>
  <style type="text/css">
    body, h1, p, ul, li {
      margin: 0;
      padding: 0;
    }

    html, body {
      overflow: hidden;
    }

    body {
      background-color: #1a1a2e;
      color: #e0e0e0;
      font-family: Georgia, "Times New Roman", Times, serif;
      text-align: center;
    }

    #wrapper {
      width: 95%;
      max-width: 1580px;
      margin: 0 auto;
      padding: 0;
    }

    video {
      display: block;
      width: 100%;
      max-width: 1580px;
      max-height: 986px;
      border-radius: 6px;
      background: #000;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    }

  </style>
</head>
<body>
  <div id="wrapper">
    <video id="player" controls preload="auto" autoplay onended="autoNext()">
      Il tuo browser non supporta il tag video HTML5.
    </video>
  </div>

  <script type="text/javascript" src="../settings.js"></script>
  <script type="text/javascript">
    var playlist = ['test.mp4', 'test2.mp4', 'test3.mp4', 'test4.mp4', 'test5.mp4'];
    var current = 0;
    var player = document.getElementById('player');

    function autoNext() {
      if (Math.random() > REDIRECT_THRESHOLD) {
        window.location.href = '../index.html';
        return;
      }
      var next;
      do {
        next = Math.floor(Math.random() * playlist.length);
      } while (next === current && playlist.length > 1);
      playItem(next);
    }

    function playItem(index) {
      current = index;
      player.src = playlist[current];
      player.load();
      player.play();
    }

    // Carica e avvia un video a caso
    current = Math.floor(Math.random() * playlist.length);
    player.src = playlist[current];
    player.load();
    player.play();
  </script>
</body>
</html>
