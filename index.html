<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
  "http://www.w3.org/TR/html4/loose.dtd">
<html lang="it">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ECO-SOCIAL DESIGN MASTER - PROJECT 2</title>
  <style type="text/css">
    body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script type="text/javascript" src="settings.js"></script>
  <script type="text/javascript">
    setTimeout(function() { window.location.href = 'videos/play.html'; }, REDIRECT_SECONDS * 1000);

    var canvas = document.getElementById('c');
    var ctx = canvas.getContext('2d');
    var W, H, tick;

    var COLORS = ['#00FF41', '#FF00FF', '#00FFFF', '#FFFF00', '#FF4400', '#FF0066', '#39FF14'];
    var shapes = [];

    /* scrolling text state */
    var T1 = 'ECO-SOCIAL DESIGN';
    var T2 = 'PROJECT 2';
    var t1X = 0, t1Y = 0;
    var t2X = 0, t2Y = 0;
    var t1Speed = 3.2;
    var t2Speed = 2.5;

    function resize() {
      W = canvas.width = window.innerWidth || document.documentElement.clientWidth;
      H = canvas.height = window.innerHeight || document.documentElement.clientHeight;
      t1X = Math.round(Math.random() * W);
      t1Y = Math.round(H * 0.15 + Math.random() * H * 0.7);
      t2X = Math.round(Math.random() * W);
      t2Y = Math.round(H * 0.15 + Math.random() * H * 0.7);
    }

    function rnd(n) { return Math.floor(Math.random() * n); }

    function makeShape() {
      var size = 16 + rnd(130);
      return {
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 2.5,
        vy: (Math.random() - 0.5) * 2.5,
        size: size,
        color: COLORS[rnd(COLORS.length)],
        type: rnd(5),
        alpha: 0.12 + Math.random() * 0.45,
        rot: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.04
      };
    }

    function initShapes() {
      shapes = [];
      tick = 0;
      W = W || 800;
      H = H || 600;
      t1X = Math.round(Math.random() * W);
      t1Y = Math.round(H * 0.15 + Math.random() * H * 0.7);
      t2X = Math.round(Math.random() * W);
      t2Y = Math.round(H * 0.15 + Math.random() * H * 0.7);
      var i;
      for (i = 0; i < 22; i++) {
        shapes.push(makeShape());
      }
    }

    function drawShape(s) {
      ctx.save();
      ctx.globalAlpha = s.alpha;
      ctx.fillStyle = s.color;
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 3;
      ctx.translate(Math.round(s.x), Math.round(s.y));
      ctx.rotate(s.rot);
      var h = Math.round(s.size);
      if (s.type === 0) {
        ctx.fillRect(-h / 2, -h / 2, h, h);
      } else if (s.type === 1) {
        ctx.strokeRect(-h / 2, -h / 2, h, h);
      } else if (s.type === 2) {
        ctx.beginPath();
        ctx.arc(0, 0, h / 2, 0, Math.PI * 2);
        ctx.fill();
      } else if (s.type === 3) {
        ctx.beginPath();
        ctx.moveTo(0, -h / 2);
        ctx.lineTo(h / 2, 0);
        ctx.lineTo(0, h / 2);
        ctx.lineTo(-h / 2, 0);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.moveTo(0, -h / 2);
        ctx.lineTo(h / 2, h / 2);
        ctx.lineTo(-h / 2, h / 2);
        ctx.closePath();
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawScanlines() {
      ctx.save();
      ctx.globalAlpha = 0.22;
      ctx.fillStyle = '#000';
      var y;
      for (y = 0; y < H; y += 2) {
        ctx.fillRect(0, y, W, 1);
      }
      ctx.restore();
    }

    function drawNoise() {
      ctx.save();
      ctx.globalAlpha = 0.13;
      var i, nx, ny;
      for (i = 0; i < 180; i++) {
        nx = rnd(W);
        ny = rnd(H);
        ctx.fillStyle = COLORS[rnd(COLORS.length)];
        ctx.fillRect(nx, ny, 2, 2);
      }
      ctx.restore();
    }

    function drawGlitch() {
      /* horizontal bar displacement - always on low level */
      var n = rnd(3) + 1;
      var i, sliceY, sliceH, offset;
      ctx.save();
      ctx.globalAlpha = 1.0;
      for (i = 0; i < n; i++) {
        sliceY = rnd(H);
        sliceH = rnd(6) + 2;
        offset = (rnd(30) - 15);
        try {
          ctx.drawImage(canvas, 0, sliceY, W, sliceH, offset, sliceY, W, sliceH);
        } catch(e) {}
      }
      ctx.restore();

      /* heavy glitch burst every ~60 frames */
      if (tick % 61 === 0) {
        var bursts = rnd(6) + 3;
        ctx.save();
        for (i = 0; i < bursts; i++) {
          sliceY = rnd(H);
          sliceH = rnd(18) + 4;
          offset = (rnd(80) - 40);
          ctx.globalAlpha = 0.7 + Math.random() * 0.3;
          try {
            ctx.drawImage(canvas, 0, sliceY, W, sliceH, offset, sliceY, W, sliceH);
          } catch(e) {}
        }
        ctx.restore();
      }

      /* color flash bars */
      if (tick % 23 === 0) {
        ctx.save();
        var nb = rnd(3) + 1;
        for (i = 0; i < nb; i++) {
          ctx.globalAlpha = 0.12 + Math.random() * 0.20;
          ctx.fillStyle = COLORS[rnd(COLORS.length)];
          ctx.fillRect(0, rnd(H), W, rnd(8) + 1);
        }
        ctx.restore();
      }

      /* vertical slice shift */
      if (tick % 43 === 0) {
        ctx.save();
        ctx.globalAlpha = 1.0;
        var vx = rnd(W);
        var vw = rnd(60) + 10;
        var vy = rnd(8) - 4;
        try {
          ctx.drawImage(canvas, vx, 0, vw, H, vx, vy, vw, H);
        } catch(e) {}
        ctx.restore();
      }
    }

    function drawText() {
      var fs1 = Math.max(30, Math.round(H / 5));
      var fs2 = Math.max(40, Math.round(H / 3.5));
      var font1 = 'bold ' + fs1 + 'px Impact, "Arial Black", Arial, sans-serif';
      var font2 = 'bold ' + fs2 + 'px Impact, "Arial Black", Arial, sans-serif';

      ctx.save(); ctx.font = font1; var tw1 = ctx.measureText(T1).width; ctx.restore();
      ctx.save(); ctx.font = font2; var tw2 = ctx.measureText(T2).width; ctx.restore();

      /* advance T1 */
      t1X -= t1Speed;
      if (t1X + tw1 < 0) {
        t1X = Math.round(W * 0.1 + Math.random() * W * 0.9);
        t1Y = Math.round(H * 0.15 + Math.random() * H * 0.7);
      }

      /* advance T2 */
      t2X -= t2Speed;
      if (t2X + tw2 < 0) {
        t2X = Math.round(W * 0.1 + Math.random() * W * 0.9);
        t2Y = Math.round(H * 0.15 + Math.random() * H * 0.7);
      }

      var flicker1 = (tick % 11 === 0) ? 0.5 : 1.0;
      var flicker2 = (tick % 17 === 0) ? 0.55 : 1.0;
      var gx1 = (tick % 29 === 0) ? rnd(14) - 7 : 0;
      var gx2 = (tick % 37 === 0) ? rnd(10) - 5 : 0;

      /* --- T1: ECO-SOCIAL DESIGN --- cyan/magenta aberration, green main --- */
      ctx.save(); ctx.globalAlpha = 0.45; ctx.fillStyle = '#00FFFF'; ctx.font = font1;
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(T1, Math.round(t1X) - 5, Math.round(t1Y) + 3); ctx.restore();

      ctx.save(); ctx.globalAlpha = 0.45; ctx.fillStyle = '#FF00FF'; ctx.font = font1;
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(T1, Math.round(t1X) + 5, Math.round(t1Y) - 3); ctx.restore();

      ctx.save(); ctx.globalAlpha = flicker1; ctx.fillStyle = '#00FF41'; ctx.font = font1;
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(T1, Math.round(t1X) + gx1, Math.round(t1Y)); ctx.restore();

      /* --- T2: PROJECT 2 --- inverted: green/yellow aberration, magenta main --- */
      ctx.save(); ctx.globalAlpha = 0.45; ctx.fillStyle = '#00FF41'; ctx.font = font2;
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(T2, Math.round(t2X) - 6, Math.round(t2Y) + 4); ctx.restore();

      ctx.save(); ctx.globalAlpha = 0.45; ctx.fillStyle = '#FFFF00'; ctx.font = font2;
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(T2, Math.round(t2X) + 6, Math.round(t2Y) - 4); ctx.restore();

      ctx.save(); ctx.globalAlpha = flicker2; ctx.fillStyle = '#FF00FF'; ctx.font = font2;
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(T2, Math.round(t2X) + gx2, Math.round(t2Y)); ctx.restore();
    }

    function update() {
      var i, s;
      for (i = 0; i < shapes.length; i++) {
        s = shapes[i];
        s.x += s.vx;
        s.y += s.vy;
        s.rot += s.rotSpeed;
        if (s.x < -s.size * 2) { s.x = W + s.size; }
        if (s.x > W + s.size * 2) { s.x = -s.size; }
        if (s.y < -s.size * 2) { s.y = H + s.size; }
        if (s.y > H + s.size * 2) { s.y = -s.size; }
      }
    }

    function draw() {
      ctx.save();
      ctx.globalAlpha = 0.80;
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();

      var i;
      for (i = 0; i < shapes.length; i++) {
        drawShape(shapes[i]);
      }

      drawGlitch();
      drawNoise();
      drawScanlines();
      drawText();

      tick++;
    }

    resize();
    initShapes();

    window.onresize = function() { resize(); };

    setInterval(function() {
      update();
      draw();
    }, 33);
  </script>
</body>
</html>
