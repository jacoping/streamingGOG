<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
  "http://www.w3.org/TR/html4/loose.dtd">
<html lang="it">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ECO-SOCIAL DESIGN MASTER - PROJECT 2</title>
  <style type="text/css">
    body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script type="text/javascript" src="settings.js"></script>
  <script type="text/javascript">
    var REDIRECT_SECONDS = REDIRECT_MIN + Math.random() * (REDIRECT_MAX - REDIRECT_MIN);
    setTimeout(function() { window.location.href = 'play.html'; }, REDIRECT_SECONDS * 1000);

    var canvas = document.getElementById('c');
    var ctx = canvas.getContext('2d');
    var W, H, tick;

    var COLORS = ['#00FF41','#FF00FF','#00FFFF','#FFFF00','#FF4400','#FF0066','#39FF14',
                   '#FF6600','#0066FF','#CC00FF','#00FFCC','#FF3300','#FF9900','#00FF99','#FF0099','#66FF00','#FF66FF','#00CCFF'];
    var shapes = [];

    /* name lists for ticker lines T4 and T5 */
    var NAMES_A = ['Alessandra Capuano','Luca Collignan','Belén Pérez González',
                   'Louis Steinhauser','Thore Flynn Hadré','Franziska Fröstl',
                   'Julia Gómez de Frutos','Flavia Padulano','Alessia Zanotti',
                   'Luca Toscano','David Schwarzfeld','Wentao Lu',
                   'Johanna Cepeda Hess','Sophie Louise Meyer','Shreya Deshpande',
                   'Paula Götz','Lina Korneffel','Marieke Schäfer','Ella Stauber',
                   'Elena Galvani','Beatrice Guerra','Anna Pitton','Tommaso Sottopietra',
                   'Giulia Galli','Laura Kalser','Alessia Piscioli','Adriana Sotomayor',
                   'Anaël Eliot Arthur','Aparna Gomathi Nataraja Pandian',
                   'Carlota Salvador Coutinho Coelho da Silva Portela','Dide Su Unluakin'];
    var NAMES_B = ['SozGym FoTour','EURAC','BASIS','Kunst Merano Arte','Comune di Trento',
                   'Shifton','Jugenddienst Merano','Forum Prevenzione','kaleido:coop'];

    function shuffle(arr) {
      var a = arr.slice(), i, j, t;
      for (i = a.length - 1; i > 0; i--) {
        j = rnd(i + 1);
        t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    function buildNames(arr) { return shuffle(arr).join(', ').toUpperCase() + '  '; }

    /* scrolling text state */
    var T1 = 'PROJECT 2 IN ECO-SOCIAL DESIGN';
    var T2 = 'IN THE FIELD';
    var t1X = 0, t1Y = 0;
    var t2X = 0, t2Y = 0;
    var t1Speed = 2.0 + Math.random() * 3.0;  /* 2.0–5.0 */
    var t2Speed = 1.2 + Math.random() * 2.0;  /* 1.2–3.2, always slower than T1 range */

    /* hide/flash state */
    var t1HideUntil = 0;
    var t2HideUntil = 0;
    var t1FlashUntil = 0;
    var t2FlashUntil = 0;
    var t1FlashColor = '#00FF41';
    var t2FlashColor = '#FF00FF';

    /* base + chromatic-aberration colors — re-randomised at init and on each text restart */
    var t1BaseColor = '#00FF41';
    var t2BaseColor = '#FF00FF';
    var t1GlowA = '#00FFFF';
    var t1GlowB = '#FF00FF';
    var t2GlowA = '#00FF41';
    var t2GlowB = '#FFFF00';

    /* small fast ticker lines */
    var T3 = 'MARCH 3RD — JUNE 12TH 2026';
    var T4 = '';
    var T5 = '';
    var t3X = 0, t3Y = 0, t3Speed = 4.5 + Math.random() * 3.0, t3Color = '#00FFFF';
    var t4X = 0, t4Y = 0, t4Speed = 5.0 + Math.random() * 4.0, t4Color = '#FFFF00';
    var t5X = 0, t5Y = 0, t5Speed = 4.0 + Math.random() * 3.5, t5Color = '#FF00FF';

    function resize() {
      W = canvas.width = window.innerWidth || document.documentElement.clientWidth;
      H = canvas.height = window.innerHeight || document.documentElement.clientHeight;
      t1X = Math.round(Math.random() * W);
      t1Y = Math.round(H * 0.15 + Math.random() * H * 0.7);
      t2X = Math.round(Math.random() * W);
      t2Y = Math.round(H * 0.15 + Math.random() * H * 0.7);
      t3X = Math.round(Math.random() * W);
      t3Y = Math.round(H * 0.04 + Math.random() * H * 0.92);
      t4X = Math.round(Math.random() * W);
      t4Y = Math.round(H * 0.04 + Math.random() * H * 0.92);
      t5X = Math.round(Math.random() * W);
      t5Y = Math.round(H * 0.04 + Math.random() * H * 0.92);
    }

    function rnd(n) { return Math.floor(Math.random() * n); }

    function pickTextColors() {
      t1BaseColor = COLORS[rnd(COLORS.length)];
      t2BaseColor = COLORS[rnd(COLORS.length)];
      t1GlowA    = COLORS[rnd(COLORS.length)];
      t1GlowB    = COLORS[rnd(COLORS.length)];
      t2GlowA    = COLORS[rnd(COLORS.length)];
      t2GlowB    = COLORS[rnd(COLORS.length)];
    }

    function makeShape() {
      var size = 16 + rnd(130);
      return {
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 2.5,
        vy: (Math.random() - 0.5) * 2.5,
        size: size,
        color: COLORS[rnd(COLORS.length)],
        type: rnd(10),
        alpha: 0.12 + Math.random() * 0.45,
        rot: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.04
      };
    }

    function initShapes() {
      shapes = [];
      tick = 0;
      W = W || 800;
      H = H || 600;
      t1X = Math.round(Math.random() * W);
      t1Y = Math.round(H * 0.15 + Math.random() * H * 0.7);
      t2X = Math.round(Math.random() * W);
      t2Y = Math.round(H * 0.15 + Math.random() * H * 0.7);
      t3X = Math.round(Math.random() * W);
      t3Y = Math.round(H * 0.04 + Math.random() * H * 0.92);
      T4 = buildNames(NAMES_A);
      t4X = W; /* start off right edge so it scrolls in cleanly */
      t4Y = Math.round(H * 0.04 + Math.random() * H * 0.92);
      T5 = buildNames(NAMES_B);
      t5X = W;
      t5Y = Math.round(H * 0.04 + Math.random() * H * 0.92);
      pickTextColors();
      var i;
      for (i = 0; i < 60; i++) {
        shapes.push(makeShape());
      }
    }

    function drawShape(s) {
      ctx.save();
      ctx.globalAlpha = s.alpha;
      ctx.fillStyle = s.color;
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 3;
      ctx.translate(Math.round(s.x), Math.round(s.y));
      ctx.rotate(s.rot);
      var h = Math.round(s.size);
      if (s.type === 0) {
        ctx.fillRect(-h / 2, -h / 2, h, h);
      } else if (s.type === 1) {
        ctx.strokeRect(-h / 2, -h / 2, h, h);
      } else if (s.type === 2) {
        ctx.beginPath();
        ctx.arc(0, 0, h / 2, 0, Math.PI * 2);
        ctx.fill();
      } else if (s.type === 3) {
        ctx.beginPath();
        ctx.moveTo(0, -h / 2);
        ctx.lineTo(h / 2, 0);
        ctx.lineTo(0, h / 2);
        ctx.lineTo(-h / 2, 0);
        ctx.closePath();
        ctx.fill();
      } else if (s.type === 5) {
        /* ring */
        ctx.lineWidth = Math.max(2, Math.round(h * 0.12));
        ctx.beginPath(); ctx.arc(0, 0, h / 2, 0, Math.PI * 2); ctx.stroke();
      } else if (s.type === 6) {
        /* plus / cross */
        var t6 = Math.max(2, Math.round(h * 0.18));
        ctx.fillRect(-t6 / 2, -h / 2, t6, h);
        ctx.fillRect(-h / 2, -t6 / 2, h, t6);
      } else if (s.type === 7) {
        /* horizontal line */
        ctx.lineWidth = Math.max(2, Math.round(h * 0.10));
        ctx.beginPath(); ctx.moveTo(-h / 2, 0); ctx.lineTo(h / 2, 0); ctx.stroke();
      } else if (s.type === 8) {
        /* X mark */
        ctx.lineWidth = Math.max(2, Math.round(h * 0.12));
        ctx.beginPath(); ctx.moveTo(-h / 2, -h / 2); ctx.lineTo(h / 2, h / 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(h / 2, -h / 2); ctx.lineTo(-h / 2, h / 2); ctx.stroke();
      } else {
        /* triangle stroke */
        ctx.beginPath();
        ctx.moveTo(0, -h / 2);
        ctx.lineTo(h / 2, h / 2);
        ctx.lineTo(-h / 2, h / 2);
        ctx.closePath();
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawScanlines() {
      ctx.save();
      ctx.globalAlpha = 0.22;
      ctx.fillStyle = '#000';
      var y;
      for (y = 0; y < H; y += 2) {
        ctx.fillRect(0, y, W, 1);
      }
      ctx.restore();
    }

    function drawNoise() {
      ctx.save();
      ctx.globalAlpha = 0.13;
      var i, nx, ny;
      for (i = 0; i < 180; i++) {
        nx = rnd(W);
        ny = rnd(H);
        ctx.fillStyle = COLORS[rnd(COLORS.length)];
        ctx.fillRect(nx, ny, 2, 2);
      }
      ctx.restore();
    }

    function drawGlitch() {
      /* horizontal bar displacement - always on low level */
      var n = rnd(3) + 1;
      var i, sliceY, sliceH, offset;
      ctx.save();
      ctx.globalAlpha = 1.0;
      for (i = 0; i < n; i++) {
        sliceY = rnd(H);
        sliceH = rnd(6) + 2;
        offset = (rnd(30) - 15);
        try {
          ctx.drawImage(canvas, 0, sliceY, W, sliceH, offset, sliceY, W, sliceH);
        } catch(e) {}
      }
      ctx.restore();

      /* heavy glitch burst every ~60 frames */
      if (tick % 61 === 0) {
        var bursts = rnd(6) + 3;
        ctx.save();
        for (i = 0; i < bursts; i++) {
          sliceY = rnd(H);
          sliceH = rnd(18) + 4;
          offset = (rnd(80) - 40);
          ctx.globalAlpha = 0.7 + Math.random() * 0.3;
          try {
            ctx.drawImage(canvas, 0, sliceY, W, sliceH, offset, sliceY, W, sliceH);
          } catch(e) {}
        }
        ctx.restore();
      }

      /* color flash bars */
      if (tick % 23 === 0) {
        ctx.save();
        var nb = rnd(3) + 1;
        for (i = 0; i < nb; i++) {
          ctx.globalAlpha = 0.12 + Math.random() * 0.20;
          ctx.fillStyle = COLORS[rnd(COLORS.length)];
          ctx.fillRect(0, rnd(H), W, rnd(8) + 1);
        }
        ctx.restore();
      }

      /* vertical slice shift */
      if (tick % 43 === 0) {
        ctx.save();
        ctx.globalAlpha = 1.0;
        var vx = rnd(W);
        var vw = rnd(60) + 10;
        var vy = rnd(8) - 4;
        try {
          ctx.drawImage(canvas, vx, 0, vw, H, vx, vy, vw, H);
        } catch(e) {}
        ctx.restore();
      }
    }

    function drawText() {
      var fs1 = Math.max(30, Math.round(H / 5));
      var fs2 = Math.max(40, Math.round(H / 3.5));
      var fs3 = Math.max(22, Math.round(H / 11));  /* date ticker — larger */
      var fs4 = Math.max(11, Math.round(H / 22));  /* names ticker — small */
      var font1 = 'bold ' + fs1 + 'px Impact, "Arial Black", Arial, sans-serif';
      var font2 = 'bold ' + fs2 + 'px Impact, "Arial Black", Arial, sans-serif';
      var font3 = 'bold ' + fs3 + 'px Impact, "Arial Black", Arial, sans-serif';
      var font4 = 'bold ' + fs4 + 'px Impact, "Arial Black", Arial, sans-serif';

      ctx.save(); ctx.font = font1; var tw1 = ctx.measureText(T1).width; ctx.restore();
      ctx.save(); ctx.font = font2; var tw2 = ctx.measureText(T2).width; ctx.restore();
      ctx.save(); ctx.font = font3; var tw3 = ctx.measureText(T3).width; ctx.restore();
      ctx.save(); ctx.font = font4; var tw4 = ctx.measureText(T4).width; ctx.restore();
      ctx.save(); ctx.font = font4; var tw5 = ctx.measureText(T5).width; ctx.restore();

      /* advance T1 */
      t1X -= t1Speed;
      if (t1X + tw1 < 0) {
        t1X = Math.round(W * 0.1 + Math.random() * W * 0.9);
        t1Y = Math.round(H * 0.15 + Math.random() * H * 0.7);
        t1Speed = 2.0 + Math.random() * 3.0;
        t1BaseColor = COLORS[rnd(COLORS.length)];
        t1GlowA = COLORS[rnd(COLORS.length)];
        t1GlowB = COLORS[rnd(COLORS.length)];
      }

      /* advance T2 */
      t2X -= t2Speed;
      if (t2X + tw2 < 0) {
        t2X = Math.round(W * 0.1 + Math.random() * W * 0.9);
        t2Y = Math.round(H * 0.15 + Math.random() * H * 0.7);
        t2Speed = 1.2 + Math.random() * 2.0;
        t2BaseColor = COLORS[rnd(COLORS.length)];
        t2GlowA = COLORS[rnd(COLORS.length)];
        t2GlowB = COLORS[rnd(COLORS.length)];
      }

      /* advance T3 (date) */
      t3X -= t3Speed;
      if (t3X + tw3 < 0) {
        t3X = W + Math.round(Math.random() * W * 0.5); /* random gap before reappearing */
        t3Y = Math.round(H * 0.04 + Math.random() * H * 0.92);
        t3Speed = 4.5 + Math.random() * 3.0;
        t3Color = COLORS[rnd(COLORS.length)];
      }

      /* advance T4 (names A) — reshuffle on each full pass */
      t4X -= t4Speed;
      if (t4X + tw4 < 0) {
        T4 = buildNames(NAMES_A);
        t4X = W + Math.round(Math.random() * W * 0.3);
        t4Y = Math.round(H * 0.04 + Math.random() * H * 0.92);
        t4Speed = 5.0 + Math.random() * 4.0;
        t4Color = COLORS[rnd(COLORS.length)];
      }

      /* advance T5 (names B) — reshuffle on each full pass */
      t5X -= t5Speed;
      if (t5X + tw5 < 0) {
        T5 = buildNames(NAMES_B);
        t5X = W + Math.round(Math.random() * W * 0.3);
        t5Y = Math.round(H * 0.04 + Math.random() * H * 0.92);
        t5Speed = 4.0 + Math.random() * 3.5;
        t5Color = COLORS[rnd(COLORS.length)];
      }

      /* random hide triggers */
      if (t1HideUntil === 0 && rnd(220) === 0) { t1HideUntil = tick + rnd(18) + 4; }
      if (t2HideUntil === 0 && rnd(180) === 0) { t2HideUntil = tick + rnd(24) + 4; }

      /* random color flash triggers */
      if (t1FlashUntil === 0 && rnd(140) === 0) { t1FlashUntil = tick + rnd(5) + 2; t1FlashColor = COLORS[rnd(COLORS.length)]; }
      if (t2FlashUntil === 0 && rnd(120) === 0) { t2FlashUntil = tick + rnd(5) + 2; t2FlashColor = COLORS[rnd(COLORS.length)]; }

      var t1Vis = (t1HideUntil === 0 || tick > t1HideUntil);
      if (t1HideUntil > 0 && tick > t1HideUntil) { t1HideUntil = 0; }
      var t2Vis = (t2HideUntil === 0 || tick > t2HideUntil);
      if (t2HideUntil > 0 && tick > t2HideUntil) { t2HideUntil = 0; }

      var t1Color = (t1FlashUntil > 0 && tick <= t1FlashUntil) ? t1FlashColor : t1BaseColor;
      if (t1FlashUntil > 0 && tick > t1FlashUntil) { t1FlashUntil = 0; }
      var t2Color = (t2FlashUntil > 0 && tick <= t2FlashUntil) ? t2FlashColor : t2BaseColor;
      if (t2FlashUntil > 0 && tick > t2FlashUntil) { t2FlashUntil = 0; }

      var flicker1 = (tick % 11 === 0) ? 0.5 : 1.0;
      var flicker2 = (tick % 17 === 0) ? 0.55 : 1.0;
      var gx1 = (tick % 29 === 0) ? rnd(14) - 7 : 0;
      var gx2 = (tick % 37 === 0) ? rnd(10) - 5 : 0;

      /* --- T1: ECO-SOCIAL DESIGN --- */
      if (t1Vis) {
        ctx.save(); ctx.globalAlpha = 0.45; ctx.fillStyle = t1GlowA; ctx.font = font1;
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(T1, Math.round(t1X) - 5, Math.round(t1Y) + 3); ctx.restore();

        ctx.save(); ctx.globalAlpha = 0.45; ctx.fillStyle = t1GlowB; ctx.font = font1;
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(T1, Math.round(t1X) + 5, Math.round(t1Y) - 3); ctx.restore();

        ctx.save(); ctx.globalAlpha = flicker1; ctx.fillStyle = t1Color; ctx.font = font1;
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(T1, Math.round(t1X) + gx1, Math.round(t1Y)); ctx.restore();
      }

      /* --- T2: PROJECT 2 --- */
      if (t2Vis) {
        ctx.save(); ctx.globalAlpha = 0.45; ctx.fillStyle = t2GlowA; ctx.font = font2;
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(T2, Math.round(t2X) - 6, Math.round(t2Y) + 4); ctx.restore();

        ctx.save(); ctx.globalAlpha = 0.45; ctx.fillStyle = t2GlowB; ctx.font = font2;
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(T2, Math.round(t2X) + 6, Math.round(t2Y) - 4); ctx.restore();

        ctx.save(); ctx.globalAlpha = flicker2; ctx.fillStyle = t2Color; ctx.font = font2;
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(T2, Math.round(t2X) + gx2, Math.round(t2Y)); ctx.restore();
      }

      /* --- T3: date line --- */
      ctx.save(); ctx.globalAlpha = 0.75; ctx.fillStyle = t3Color; ctx.font = font3;
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(T3, Math.round(t3X), Math.round(t3Y)); ctx.restore();

      /* --- T4: names A --- */
      ctx.save(); ctx.globalAlpha = 0.65; ctx.fillStyle = t4Color; ctx.font = font4;
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(T4, Math.round(t4X), Math.round(t4Y)); ctx.restore();

      /* --- T5: names B --- */
      ctx.save(); ctx.globalAlpha = 0.65; ctx.fillStyle = t5Color; ctx.font = font4;
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(T5, Math.round(t5X), Math.round(t5Y)); ctx.restore();
    }

    function update() {
      var i, s;
      for (i = 0; i < shapes.length; i++) {
        s = shapes[i];
        s.x += s.vx;
        s.y += s.vy;
        s.rot += s.rotSpeed;
        if (s.x < -s.size * 2) { s.x = W + s.size; }
        if (s.x > W + s.size * 2) { s.x = -s.size; }
        if (s.y < -s.size * 2) { s.y = H + s.size; }
        if (s.y > H + s.size * 2) { s.y = -s.size; }
        /* occasionally change colour */
        if (rnd(600) === 0) { s.color = COLORS[rnd(COLORS.length)]; }
      }
    }

    function draw() {
      ctx.save();
      ctx.globalAlpha = 0.80;
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();

      var i;
      for (i = 0; i < shapes.length; i++) {
        drawShape(shapes[i]);
      }

      drawGlitch();
      drawNoise();
      drawScanlines();
      drawText();

      tick++;
    }

    resize();
    initShapes();

    window.onresize = function() { resize(); };

    setInterval(function() {
      update();
      draw();
    }, 33);
  </script>
</body>
</html>
