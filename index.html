<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
  "http://www.w3.org/TR/html4/loose.dtd">
<html lang="it">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project 2 in Eco-Social Design - Summer 2026</title>
  <style type="text/css">
    body, h1, p, ul, li {
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1a2e;
      color: #e0e0e0;
      font-family: Georgia, "Times New Roman", Times, serif;
      text-align: center;
    }

    #wrapper {
      width: 95%;
      max-width: 1580px;
      margin: 0 auto;
      padding: 40px 20px 60px 20px;
    }

    video {
      width: 100%;
      max-width: 1540px;
      border-radius: 6px;
      background: #000;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    }

    ul.playlist li .num {
      color: #5a6a7a;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <video id="player" controls preload="metadata" onended="autoNext()">
      Il tuo browser non supporta il tag video HTML5.
    </video>
  </div>

  <script type="text/javascript">
    var playlist = ['test.mp4', 'test2.mp4', 'test3.mp4', 'test4.mp4'];
    var current = 0;
    var player = document.getElementById('player');

    function autoNext() {
      var next = (current + 1) % playlist.length;
      playItem(next);
    }

    function playItem(index) {
      current = index;
      player.src = playlist[current];
      player.load();
      player.play();
    }

    // Carica il primo video
    player.src = playlist[0];
  </script>
</body>
</html>
